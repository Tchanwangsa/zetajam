  <!-- The full lockup, trimmed to its artwork: the supplied file was 234x88
       with the mark sitting at an offset and a slab of dead space around it.
       Same paths, origin moved to the top-left of the drawing, so this scales
       to any width without a caller having to crop it.

       Colours are its own, like favicon.svg — this is the copy that goes out on
       its own (README, a press kit, an <img>), where there is no page around it
       to inherit from. The in-app lockup is Mark.svelte plus live text, and
       that one is still currentColor. -->
