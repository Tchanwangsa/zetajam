# Checks on every push and pull request; on master they gate a deploy of both
# halves of the app — the Go hub to Cloud Run, the page to Vercel.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# One run per branch. Pull requests cancel their own stale runs; a push does
# not, because cancelling mid-deploy would leave Cloud Run half-rolled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION_FILE: go.mod
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  VERCEL_VERSION: '59.10.0'

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: go.sum

      # pnpm before setup-node, or `cache: pnpm` has no pnpm to find.
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      # `make check` is parity + go vet + svelte-check. Parity is the one that
      # matters most here: the Go and TypeScript question generators have to
      # agree bit for bit, and nothing else in CI would notice if they drifted.
      - name: check
        run: make check

      # Compiles the vite bundle and the binary that embeds it. Cheap next to a
      # Cloud Build round trip, and it fails here instead of three minutes in.
      - name: build
        run: make build

  cloud-run:
    # The steps live in deploy-server.yml because the manual deploy button in
    # deploy.yml runs the same ones, and two copies of a build is how one of
    # them ends up a version behind.
    name: deploy server
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write # the called workflow federates with this
    secrets: inherit
    uses: ./.github/workflows/deploy-server.yml

  vercel:
    name: deploy page (vercel)
    # After the server, not beside it: the page talks a wire protocol the
    # server defines, so the old page against the new server is survivable and
    # the new page against the old server is not.
    needs: [check, cloud-run]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # `vercel build` runs the install itself, and it picks the package
      # manager from the lockfile it finds — pnpm-lock.yaml here, which is not
      # on the runner unless we put it there. Without this the build dies on
      # `spawn pnpm ENOENT` after a pull that worked perfectly.
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Pinned, not @latest. The CLI ships breaking changes on its own
      # schedule, and @latest turns one of those into a deploy that fails on a
      # commit which touched nothing. Bump it on purpose, in this file.
      - run: npm install -g vercel@${{ env.VERCEL_VERSION }}

      # Run from web/, which is what `vercel link` was pointed at — the .vercel
      # directory lives there and the project's root is that directory, not the
      # repo root. If you ever set a Root Directory of "web" in the project
      # settings, this has to move up a level to match.
      - name: deploy
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Optional. Only exported when set, because an empty VITE_WS_URL is
          # worse than an absent one: the page would fall back to its own
          # origin and try to open a socket against Vercel.
          WS_URL: ${{ vars.VITE_WS_URL }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          if [ -n "${WS_URL:-}" ]; then export VITE_WS_URL="${WS_URL}"; fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "page: $url"
          echo "- page: $url" >> "$GITHUB_STEP_SUMMARY"
